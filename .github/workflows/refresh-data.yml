name: Refresh EPL data

# Runs on GitHub's own servers, for free, so the live site's data stays
# current even though the free hosting tier itself has no persistent disk.
# When this workflow commits changed files, Render (or any host watching
# this repo) picks up the new commit and redeploys automatically.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours -- adjust as you like
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new results and retrain if anything changed
        run: python src/update_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "epl-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw models
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh EPL data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
